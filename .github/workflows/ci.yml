# Light CI. No secrets, no database, no deploy.
#
# This workflow runs in both repositories, and the public one is why it is
# shaped the way it is: a pull request from a fork can run a workflow, so any
# secret reachable from here is a secret everyone has. There are none, and
# there is nothing here to add one to.
#
# ## Zero skips, because the fixture is built here now
#
# Seven suites need a Postgres holding Pagila plus fourteen deliberate faults —
# the connector's scope report, both rule packs against the damaged tables, the
# redaction chain, and the three CLI commands end to end. Until this workflow
# built one, they skipped, and a CI that runs everything except the parts that
# touch a database is a CI that never checks the product.
#
# A skip is not a pass. The count is still asserted rather than tolerated, and
# it is asserted at ZERO. Softening that to "skips are fine on CI" is how a
# suite quietly stops proving anything: one starts skipping, nobody sees it
# because the job was already green with skips in it.
#
# So the number stays pinned. A test that starts skipping fails the build, and
# a database-backed test that has to skip means changing EXPECTED_SKIPS in the
# same commit, where a reviewer reads it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # pgvector rather than the plain image: Pagila declares
      # `film_embedding.embedding vector(20)`, so the schema will not load
      # without the extension. Postgres 18 is also not optional — Pagila uses
      # `uuidv7()` and VIRTUAL columns, which 17 cannot parse.
      #
      # The password belongs to a container that exists for the length of one
      # job and holds nothing but a public sample database.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: pagila
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        # 22 is the real floor, and CI is what established that. The first
        # run of this workflow used ['20', '22']; on Node 20 `npm test` exited
        # 0 having run ZERO tests, because the test runner there cannot expand
        # the glob patterns the script passes:
        #
        #     Could not find '.../packages/*/test/**/*.test.ts'
        #
        # A green step that measured nothing. The skip-count check below caught
        # it only because it could find no summary to read and treats that as a
        # failure rather than as permission to assume. `engines` claimed >=20
        # until then; it says >=22 now, because that is what was measured.
        #
        # N14 in the private ledger is the debt this half-closes: before this
        # workflow every test in the project had only ever run on Windows, so
        # `spawn(..., { shell: true })` had never once executed on POSIX. It
        # does now, and the counts match Windows exactly.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # HS-A A.6. Runs in BOTH repositories, unconditionally, and that is the
      # reason `infra/check-secrets.py` and `infra/secret_patterns.py` are the
      # only two files under infra/ that publish.
      #
      # The alternative was `if [ -f infra/check-secrets.py ]` — a security
      # check that skips itself when a file is missing is a security check
      # that will one day skip itself for a reason nobody notices. Neither
      # file holds a secret or an access grant, which is what the infra/
      # boundary is actually protecting; publishing them costs nothing and
      # buys the same gate on every contributor's pull request.
      - name: Secret scan
        run: python infra/check-secrets.py

      # Type-checks the sources AND the test files. `tsconfig.test.json` exists
      # because package tsconfigs only include `src/**`, so before it the
      # assertions were transpiled and never checked — a wrong property name in
      # an assertion reached the runner as a TypeError instead of a build error.
      - name: Typecheck
        run: npm run typecheck

      # Pagila, then the fourteen faults, then the read-only role — in that
      # order, because `GRANT ... ON ALL TABLES` only covers tables that exist
      # when it runs. Getting that order wrong does not fail loudly: the role
      # sees none of the damaged tables and the scanner reports zero findings
      # with complete confidence, which is the exact product fault this
      # repository exists to catch.
      - name: Build the Pagila fixture
        env:
          PGPASSWORD: ci_fixture_only
        run: bash packages/test-fixtures/load-pagila.sh

      - name: Test
        env:
          # Both, because they mean different things. TEST_PG_DSN is what a
          # scan is pointed at; LEDAR_PAGILA_DSN is what the fixture gate
          # checks before letting a regression suite assert anything.
          TEST_PG_DSN: postgresql://ledar_reader:fixture_no_real_data@127.0.0.1:55432/pagila?sslmode=disable
          LEDAR_PAGILA_DSN: postgresql://ledar_reader:fixture_no_real_data@127.0.0.1:55432/pagila?sslmode=disable
        run: npm test 2>&1 | tee test-output.txt

      - name: Check that only the database-backed suites skipped
        shell: bash
        run: |
          EXPECTED_SKIPS=0
          skipped=$(grep -oE '^. skipped [0-9]+' test-output.txt | grep -oE '[0-9]+$' | tail -1)
          failed=$(grep -oE '^. fail [0-9]+' test-output.txt | grep -oE '[0-9]+$' | tail -1)

          echo "fail=${failed:-unknown}  skipped=${skipped:-unknown}  expected skips=$EXPECTED_SKIPS"

          if [ -z "$failed" ] || [ -z "$skipped" ]; then
            echo "::error::Could not read the test summary. The runner's output format changed;"
            echo "::error::treating that as a failure rather than assuming everything passed."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed test(s) failed."
            exit 1
          fi
          if [ "$skipped" -ne "$EXPECTED_SKIPS" ]; then
            echo "::error::$skipped suite(s) skipped; exactly $EXPECTED_SKIPS should."
            echo "::error::Every suite has a database now — the fixture is built by the step"
            echo "::error::above. A skip means either that step half-succeeded, or that the"
            echo "::error::role cannot see the damaged tables, which looks identical to a"
            echo "::error::clean database and is why the count is asserted rather than read."
            grep -iE 'skip' test-output.txt | head -40
            exit 1
          fi

      - name: Say what this did and did not cover
        if: always()
        shell: bash
        run: |
          {
            echo "### What green means here"
            echo
            echo "Every suite ran, including the seven that need a database: the"
            echo "connector's scope report, both rule packs against fourteen deliberate"
            echo "faults, the redaction chain, and the three CLI commands end to end."
            echo "Node ${{ matrix.node }}, Postgres 18, zero skips."
            echo
            echo "### What it still does not cover"
            echo
            echo "One database, built to be broken in known ways. Nothing here says how"
            echo "the rules behave on a schema nobody designed as a test — that is what"
            echo "the field benches in the private repository are for, and their limits"
            echo "are written down beside their numbers rather than implied by a tick."
          } >> "$GITHUB_STEP_SUMMARY"
